server:
  port: 8080
  shutdown: graceful

spring:
  application:
    name: agentflow-hub
  profiles:
    active: dev
  jackson:
    time-zone: Asia/Shanghai
    default-property-inclusion: non_null
  servlet:
    multipart:
      max-file-size: 20MB
      max-request-size: 25MB
  threads:
    virtual:
      enabled: true

management:
  endpoints:
    web:
      exposure:
        include: health,info
  endpoint:
    health:
      probes:
        enabled: true

logging:
  level:
    root: INFO
    com.agentflow: DEBUG
    org.springframework.web: INFO

agentflow:
  api:
    prefix: /api/v1
  trace:
    payload:
      # V39 measures the serialized UTF-8 form and fails closed before persistence.
      small-max-bytes: 16384
      tool-max-bytes: 65536
      large-max-bytes: 262144
      rag-hit-content-max-bytes: 16384
  task:
    dispatcher:
      # V38 single-instance bounded executor defaults.
      core-pool-size: 2
      max-pool-size: 4
      queue-capacity: 100
    execution:
      # V40 executes the frozen task snapshot through AgentEngine.
      mode: engine
  document:
    storage:
      # Keep runtime uploads outside this Git workspace. Override with
      # AGENTFLOW_DOCUMENT_STORAGE_ROOT in another local or deployed environment.
      root: ${AGENTFLOW_DOCUMENT_STORAGE_ROOT:${user.home}/.agentflow-hub/documents}
  security:
    jwt:
      # Empty by default on purpose. Supply the real value through IDEA's Run
      # Configuration or an environment variable; never commit a signing secret.
      issuer: agentflow-hub
      secret-base64: ${JWT_SECRET_BASE64:}
      access-token-ttl: ${JWT_ACCESS_TOKEN_TTL:PT2H}
