server:
  port: 8080
  shutdown: graceful

spring:
  application:
    name: agentflow-hub
  datasource:
    hikari:
      connection-timeout: 5000
      data-source-properties:
        # Bound PostgreSQL connect/read/cancel waits independently of settlement retries.
        connectTimeout: 5
        socketTimeout: 15
        cancelSignalTimeout: 2
        options: -c statement_timeout=10000 -c lock_timeout=5000
  profiles:
    active: dev
  jackson:
    time-zone: Asia/Shanghai
    default-property-inclusion: non_null
  servlet:
    multipart:
      max-file-size: 20MB
      max-request-size: 25MB
  threads:
    virtual:
      enabled: true

management:
  endpoints:
    web:
      exposure:
        include: health,info
  endpoint:
    health:
      probes:
        enabled: true

logging:
  level:
    root: INFO
    com.agentflow: DEBUG
    org.springframework.web: INFO

agentflow:
  agent:
    execution-policy:
      # Independent user override ceilings; execution defaults remain below task.execution.
      max-output-tokens: ${AGENTFLOW_AGENT_MAX_OUTPUT_TOKENS:16384}
      max-model-call-timeout-seconds: ${AGENTFLOW_AGENT_MAX_MODEL_CALL_TIMEOUT_SECONDS:600}
      # Exact model names verified against the selected deployment's provider. Empty denies the option.
      json-object-models: ${AGENTFLOW_AGENT_JSON_OBJECT_MODELS:}
      json-schema-models: ${AGENTFLOW_AGENT_JSON_SCHEMA_MODELS:}
      thinking-disabled-models: ${AGENTFLOW_AGENT_THINKING_DISABLED_MODELS:}
  api:
    prefix: /api/v1
  trace:
    payload:
      # V39 measures the serialized UTF-8 form and fails closed before persistence.
      small-max-bytes: 16384
      tool-max-bytes: 65536
      large-max-bytes: 262144
      rag-hit-content-max-bytes: 16384
  task:
    recovery:
      mode: ${AGENTFLOW_TASK_RECOVERY_MODE:DISABLED}
      # Mandatory stable local path shared by every JVM for this database execution domain.
      lock-path: ${AGENTFLOW_TASK_RECOVERY_LOCK_PATH:}
      batch-size: 100
    sse:
      # V42 transport resources are independent of the Runner. Bytes are serialized UTF-8 frames.
      max-connections: 128
      max-connections-per-user: 8
      batch-size: 64
      max-pending-bytes: 262144
      poll-interval-ms: 250
      heartbeat-interval-ms: 15000
      connection-timeout-ms: 300000
      send-timeout-ms: 10000
      poll-workers: 4
    dispatcher:
      # V38 single-instance bounded executor defaults.
      core-pool-size: 2
      max-pool-size: 4
      queue-capacity: 100
    execution:
      # Counts actual local work until its body exits, including abandoned calls.
      max-concurrent-external-calls: ${AGENTFLOW_TASK_MAX_CONCURRENT_EXTERNAL_CALLS:4}
      # V40 executes the frozen task snapshot through AgentEngine.
      mode: engine
      # Inherited decision output cap (1..16384); Agent overrides remain within execution-policy limits.
      decision-max-output-tokens: ${AGENTFLOW_TASK_DECISION_MAX_OUTPUT_TOKENS:512}
      # Opt in only for providers verified against the unchanged decision schema; final stays text.
      decision-json-schema-enabled: ${AGENTFLOW_TASK_DECISION_JSON_SCHEMA_ENABLED:false}
      # JSON mode is an explicit alternative to schema mode; the strict decision parser still applies.
      decision-json-object-enabled: ${AGENTFLOW_TASK_DECISION_JSON_OBJECT_ENABLED:false}
      # Only enable for a provider verified to accept thinking.type=disabled.
      provider-thinking-disabled: ${AGENTFLOW_TASK_PROVIDER_THINKING_DISABLED:false}
      # Inherited final output cap (1..16384); empty uses the task's frozen final reserve.
      final-max-output-tokens: ${AGENTFLOW_TASK_FINAL_MAX_OUTPUT_TOKENS:}
  document:
    storage:
      # Keep runtime uploads outside this Git workspace. Override with
      # AGENTFLOW_DOCUMENT_STORAGE_ROOT in another local or deployed environment.
      root: ${AGENTFLOW_DOCUMENT_STORAGE_ROOT:${user.home}/.agentflow-hub/documents}
  security:
    jwt:
      # Empty by default on purpose. Supply the real value through IDEA's Run
      # Configuration or an environment variable; never commit a signing secret.
      issuer: agentflow-hub
      secret-base64: ${JWT_SECRET_BASE64:}
      access-token-ttl: ${JWT_ACCESS_TOKEN_TTL:PT2H}
